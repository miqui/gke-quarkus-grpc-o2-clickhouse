apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-service
  labels:
    app: message-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-service
  minReplicas: 3
  maxReplicas: 6
  # CPU only. A JVM keeps the heap it has grown to (memory use tracks the -XX:MaxRAMPercentage
  # ceiling, not load), so a memory target would pin the Deployment at maxReplicas.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
