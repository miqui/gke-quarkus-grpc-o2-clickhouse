# OTLP -> ClickHouse bridge, see config/otel-collector-clickhouse.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-clickhouse
  namespace: clickhouse
  labels:
    app: otel-collector-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-clickhouse
  template:
    metadata:
      labels:
        app: otel-collector-clickhouse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits for ClickHouse, then creates the `otel` database. Both are needed before the
        # collector starts: its exporter runs the schema DDL at startup (a failure exits the
        # collector), and exporter 0.114.0 can't create the database itself - it connects with
        # `otel` already in the DSN, so the server rejects the connection with "Database otel
        # does not exist" (code 81) before CREATE DATABASE runs. The headless Service only
        # resolves once the ClickHouse pod is Ready. Credentials go in headers, not the URL, so
        # they never show up in the logs.
        - name: create-otel-database
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-default-password
                  key: password
          command:
            - sh
            - -c
            - |
              until wget -q -O - \
                  --header "X-ClickHouse-User: default" \
                  --header "X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" \
                  --post-data "CREATE DATABASE IF NOT EXISTS otel" \
                  http://ch-clickhouse-headless.clickhouse.svc.cluster.local:8123/; do
                echo "Waiting for clickhouse at ch-clickhouse-headless:8123..."
                sleep 5
              done
              echo "database otel ready"
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          args:
            - "--config=/etc/otelcol-contrib/config.yaml"
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-default-password
                  key: password
          ports:
            - containerPort: 4317
              name: otlp-grpc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-clickhouse-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-clickhouse
  namespace: clickhouse
  labels:
    app: otel-collector-clickhouse
spec:
  selector:
    app: otel-collector-clickhouse
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
