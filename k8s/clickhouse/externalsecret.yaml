# Password of ClickHouse's `default` user (settings.defaultUserPassword in
# clickhousecluster.yaml), built by External Secrets from GCP Secret Manager (seeded from
# 1Password by gke-secrets-seed.sh). Without it the operator leaves `default` passwordless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-default-password
  namespace: clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: clickhouse-default-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: clickhouse-default-password
