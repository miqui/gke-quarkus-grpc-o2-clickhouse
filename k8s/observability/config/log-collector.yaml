receivers:
  filelog:
    # Only the `default` namespace (message-service, postgres, hazelcast).
    # Widening this to every pod (argocd, kube-system, crossplane-system, ...) is a real risk
    # for OpenObserve's 5Gi PVC and its single-node MemTable - see PROMETHEUS.md step 1.
    include: [/var/log/pods/default_*/*/*.log]
    # Required by the container operator below, which reads the pod/namespace/container
    # from the file path attribute (without it: "type '<nil>' cannot be parsed as log
    # path field" on every line).
    include_file_path: true
    # A restarted collector skips whatever was logged while it was down rather than
    # replaying every file from the start (no file_storage checkpointing here).
    start_at: end
    operators:
      # Parses the CRI line format ("<time> stdout F <message>"), re-joins lines the runtime
      # split, and derives k8s.namespace.name / k8s.pod.name / k8s.pod.uid /
      # k8s.container.name / k8s.container.restart_count from the file path - so no
      # k8sattributes processor (and no ClusterRole) is needed for those.
      - type: container
        id: container-parser

processors:
  batch: {}
  # ClickHouse only gets the API's own logs, not postgres/hazelcast (OpenObserve keeps all of
  # `default`). k8s.container.name comes from the container parser above.
  filter/api-only:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["k8s.container.name"] != "message-service"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Same root basic auth the metrics/traces collector uses (see config/otel-collector.yaml).
  basicauth/openobserve:
    client_auth:
      username: ${env:OPENOBSERVE_USER}
      password: ${env:OPENOBSERVE_PASSWORD}

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
    headers:
      # One OpenObserve log stream for all pod logs (default would be "default").
      stream-name: pod_logs
    auth:
      authenticator: basicauth/openobserve
  # Via the collector in the clickhouse namespace (k8s/clickhouse/config/otel-collector-clickhouse.yaml);
  # if it's down this queues/retries/drops without affecting the OpenObserve pipeline.
  otlp/clickhouse:
    endpoint: otel-collector-clickhouse.clickhouse.svc.cluster.local:4317
    tls:
      insecure: true

service:
  extensions: [health_check, basicauth/openobserve]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    logs/clickhouse:
      receivers: [filelog]
      processors: [filter/api-only, batch]
      exporters: [otlp/clickhouse]
