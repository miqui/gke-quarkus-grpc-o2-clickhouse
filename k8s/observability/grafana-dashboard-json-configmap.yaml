apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: observability
  labels:
    app: grafana
data:
  openobserve-ops.json: |
    {
      "title": "OpenObserve Ops",
      "uid": "openobserve-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "OpenObserve Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"openobserve\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Disk Usage",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"} / zo_node_disk_total{job=\"openobserve\"} * 100", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Process Memory (RSS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Open File Descriptors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "process_open_fds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "time() - process_start_time_seconds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Ingest Rate (records/s)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_http_incoming_requests{job=\"openobserve\"}[5m])) by (endpoint, status)", "legendFormat": "{{endpoint}} ({{status}})", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "title": "HTTP Response Time p95/p99 by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p95 {{endpoint}}", "refId": "A" },
            { "expr": "histogram_quantile(0.99, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p99 {{endpoint}}", "refId": "B" }
          ]
        },
        {
          "id": 9,
          "title": "Ingest Rate by Stream Type (records/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Ingest Rate by Stream Type (bytes/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_bytes{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 11,
          "title": "In-Memory MemTable Size",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "description": "Watch this against OpenObserve's memory limit (see k8s/observability/openobserve-values.yaml resources.limits.memory) - this is what overflowed (HTTP 400 MemoryTableOverflowError) before remote_write was scoped down / OpenObserve's resources were bumped.",
          "targets": [
            { "expr": "zo_ingest_memtable_bytes{job=\"openobserve\"}", "legendFormat": "memtable", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "WAL Used Bytes by Stream Type",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum(zo_ingest_wal_used_bytes{job=\"openobserve\"}) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 13,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            { "expr": "rate(process_cpu_seconds_total{job=\"openobserve\"}[5m]) * 100", "legendFormat": "cpu", "refId": "A" }
          ]
        },
        {
          "id": 14,
          "title": "Disk Usage vs Total",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"}", "legendFormat": "used", "refId": "A" },
            { "expr": "zo_node_disk_total{job=\"openobserve\"}", "legendFormat": "total", "refId": "B" }
          ]
        }
      ]
    }
  message-service-api.json: |
    {
      "title": "message-service API",
      "uid": "message-service-api",
      "description": "Per-API gRPC/JVM/HikariCP metrics. The Service dropdown filters every series on service_name.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "query": "message-service",
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": "$__all"
              },
              {
                "selected": false,
                "text": "message-service",
                "value": "message-service"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Ready Pods",
          "description": "Pods passing readiness for the selected service(s). Replaces the old 'Service Up' panel, which only reflected whether the OTel Collector was being scraped.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{condition=\"true\",namespace=\"default\",pod=~\"$service-.*\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "DB Pool Connections (open/busy/idle)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(hikaricp_connections{service_name=~\"$service\"})",
              "refId": "A",
              "legendFormat": "open"
            },
            {
              "expr": "sum(hikaricp_connections_active{service_name=~\"$service\"})",
              "refId": "B",
              "legendFormat": "busy"
            },
            {
              "expr": "sum(hikaricp_connections_idle{service_name=~\"$service\"})",
              "refId": "C",
              "legendFormat": "idle"
            }
          ],
          "description": "HikariCP: open = connections in the pool (max 10 per pod), busy = checked out by a request, idle = open and waiting."
        },
        {
          "id": 3,
          "title": "Process CPU Usage (hottest pod)",
          "type": "gauge",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "max(process_cpu_usage{service_name=~\"$service\"})",
              "refId": "A"
            }
          ],
          "description": "process_cpu_usage: share of the CPUs the JVM sees (the container limit, rounded up)."
        },
        {
          "id": 4,
          "title": "GC Pause Time Share (worst pod)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "max(sum by (k8s_pod_name) (rate(jvm_gc_pause_milliseconds_sum{service_name=~\"$service\"}[1m])) / 1000)",
              "refId": "A"
            }
          ],
          "description": "Share of wall-clock time the JVM spent in GC pauses over the last minute (replaces the Python event-loop lag panel). A few percent is normal; sustained >10% means the heap is too small for the load."
        },
        {
          "id": 5,
          "title": "Request Rate by Method",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[1m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Average Request Latency by Method",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_sum{service_name=~\"$service\"}[1m])) by (service_name, rpc_method) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[1m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "JVM Memory by Pod",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "expr": "sum by (k8s_pod_name) (jvm_memory_used_bytes{service_name=~\"$service\",area=\"heap\"})",
              "refId": "A",
              "legendFormat": "heap {{k8s_pod_name}}"
            },
            {
              "expr": "sum by (k8s_pod_name) (jvm_memory_used_bytes{service_name=~\"$service\",area=\"nonheap\"})",
              "refId": "B",
              "legendFormat": "non-heap {{k8s_pod_name}}"
            }
          ],
          "description": "Heap and non-heap (metaspace, code cache) in use. The heap ceiling is 75% of the container memory limit (-XX:MaxRAMPercentage); see API RED & Saturation for the container working set against its limit."
        },
        {
          "id": 8,
          "title": "Error Rate by Method",
          "description": "grpc_errors_total is only created on the first error, so this panel is empty (not zero) until a request returns an error status.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  cluster-ops.json: |
    {
      "title": "Cluster ops",
      "uid": "cluster-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Nodes Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Pending / Failed / Unknown Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Node CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Node Disk Usage (/var)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/var\"} / node_filesystem_size_bytes{mountpoint=\"/var\"})) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pods by Phase",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase) by (phase)",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Container CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\",container!=\"\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Container Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace!=\"\",container!=\"\"}) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Pod Restarts by Pod (15m increase)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  postgres-ops.json: |
    {
      "title": "PostgreSQL Ops & Queries",
      "uid": "postgres-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "PostgreSQL Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_up", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Active Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_stat_activity_count)", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Buffer Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Deadlocks (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(pg_stat_database_deadlocks[1h]))", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Transaction Rate (commit vs rollback)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_xact_commit[5m])) by (datname)", "legendFormat": "commit {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_xact_rollback[5m])) by (datname)", "legendFormat": "rollback {{datname}}", "refId": "B" }
          ]
        },
        {
          "id": 6,
          "title": "Tuple Write Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_tup_inserted[5m])) by (datname)", "legendFormat": "inserted {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_tup_updated[5m])) by (datname)", "legendFormat": "updated {{datname}}", "refId": "B" },
            { "expr": "sum(rate(pg_stat_database_tup_deleted[5m])) by (datname)", "legendFormat": "deleted {{datname}}", "refId": "C" }
          ]
        },
        {
          "id": 7,
          "title": "Buffer Cache I/O Rate (hit vs disk read)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_blks_hit[5m])) by (datname)", "legendFormat": "hit {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_blks_read[5m])) by (datname)", "legendFormat": "disk read {{datname}}", "refId": "B" }
          ]
        },
        {
          "id": 8,
          "title": "Locks by Mode",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_locks_count) by (mode)", "legendFormat": "{{mode}}", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "Connections by State",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_stat_activity_count) by (state)", "legendFormat": "{{state}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Checkpoint Rate (scheduled vs requested)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(pg_stat_bgwriter_checkpoints_timed_total[5m])", "legendFormat": "scheduled", "refId": "A" },
            { "expr": "rate(pg_stat_bgwriter_checkpoints_req_total[5m])", "legendFormat": "requested", "refId": "B" }
          ]
        },
        {
          "id": 11,
          "title": "Top Queries by Execution Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "topk(10, sum(rate(pg_stat_statements_calls_total[5m])) by (queryid, datname))",
              "legendFormat": "{{queryid}} ({{datname}})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "Top Queries by Mean Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "topk(10, sum(rate(pg_stat_statements_seconds_total[5m])) by (queryid) / sum(rate(pg_stat_statements_calls_total[5m])) by (queryid))",
              "legendFormat": "{{queryid}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "Query ID -> SQL Text",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "pg_stat_statements_query_id",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
  hazelcast-cache.json: |
    {
      "title": "Hazelcast Cache",
      "uid": "hazelcast-cache",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Cluster Size (members)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_size{prefix=\"cluster\"}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Connected Clients",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_count{prefix=\"client.endpoint\"}", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "\"messages\" Map Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            {
              "expr": "com_hazelcast_metrics_hits{tag0=~\".*name=messages.*\"} / com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "\"messages\" Map Cached Entries",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_ownedentrycount{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "\"messages\" Map Operation Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_hits{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "hits", "refId": "A" },
            { "expr": "rate(com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "gets", "refId": "B" },
            { "expr": "rate(com_hazelcast_metrics_putcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "puts", "refId": "C" },
            { "expr": "rate(com_hazelcast_metrics_removecount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "removes", "refId": "D" }
          ]
        },
        {
          "id": 6,
          "title": "\"messages\" Map Average Latency (get vs put)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "rate(com_hazelcast_metrics_totalgetlatency{tag0=~\".*name=messages.*\"}[5m]) / rate(com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}[5m])",
              "legendFormat": "get",
              "refId": "A"
            },
            {
              "expr": "rate(com_hazelcast_metrics_totalputlatency{tag0=~\".*name=messages.*\"}[5m]) / rate(com_hazelcast_metrics_putcount{tag0=~\".*name=messages.*\"}[5m])",
              "legendFormat": "put",
              "refId": "B"
            }
          ]
        },
        {
          "id": 7,
          "title": "Member Heap Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "com_hazelcast_metrics_usedheap{prefix=\"memory\"}", "legendFormat": "used", "refId": "A" },
            { "expr": "com_hazelcast_metrics_committedheap{prefix=\"memory\"}", "legendFormat": "committed", "refId": "B" },
            { "expr": "com_hazelcast_metrics_maxheap{prefix=\"memory\"}", "legendFormat": "max", "refId": "C" }
          ]
        },
        {
          "id": 8,
          "title": "GC Minor Collection Time (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_minortime{prefix=\"gc\"}[5m])", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "TCP Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_activecount{prefix=\"tcp.connection\"}", "legendFormat": "active", "refId": "A" },
            { "expr": "com_hazelcast_metrics_clientcount{prefix=\"tcp.connection\"}", "legendFormat": "client", "refId": "B" }
          ]
        },
        {
          "id": 10,
          "title": "\"messages\" Map Evictions & Expirations Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_evictioncount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "evictions", "refId": "A" },
            { "expr": "rate(com_hazelcast_metrics_expirationcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "expirations", "refId": "B" }
          ]
        },
        {
          "id": 11,
          "title": "\"messages\" Map Owned Entry Memory Cost",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "com_hazelcast_metrics_ownedentrymemorycost{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "\"messages\" Map Backup Entry Count",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_backupentrycount{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        }
      ]
    }
  api-red.json: |
    {
      "title": "API RED & Saturation",
      "uid": "api-red",
      "description": "RED metrics (gRPC calls, non-OK statuses, latency) plus DB-pool and container saturation. The Service dropdown filters gRPC/DB series on service_name and container/pod series on the container name (which matches the service name).",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "query": "message-service",
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": "$__all"
              },
              {
                "selected": false,
                "text": "message-service",
                "value": "message-service"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (RPS)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "p99 Latency",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Ratio",
          "type": "gauge",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(grpc_errors_total{service_name=~\"$service\"}[5m])) or vector(0)) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "DB Pool Busy Connections",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(hikaricp_connections_active{service_name=~\"$service\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Request Rate by Method",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Latency Percentiles",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p90",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "C"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "D"
            }
          ]
        },
        {
          "id": 7,
          "title": "Error Rate by Method",
          "description": "grpc_errors_total is only created on the first error, so this panel is empty (not zero) until a request returns an error status.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Request Rate vs Error Rate (overall)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\"}[5m]))",
              "legendFormat": "requests",
              "refId": "A"
            },
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\"}[5m])) or vector(0)",
              "legendFormat": "errors",
              "refId": "B"
            }
          ]
        },
        {
          "id": 9,
          "title": "Latency by Method (p95)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\"}[5m])) by (le, service_name, rpc_method))",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "DB Connection Pool Utilization",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(hikaricp_connections_active{service_name=~\"$service\"}) by (service_name)",
              "refId": "A",
              "legendFormat": "busy {{service_name}}"
            },
            {
              "expr": "sum(hikaricp_connections_idle{service_name=~\"$service\"}) by (service_name)",
              "refId": "B",
              "legendFormat": "idle {{service_name}}"
            },
            {
              "expr": "sum(hikaricp_connections_max{service_name=~\"$service\"}) by (service_name)",
              "refId": "C",
              "legendFormat": "max (capacity) {{service_name}}"
            },
            {
              "expr": "sum(hikaricp_connections_pending{service_name=~\"$service\"}) by (service_name)",
              "refId": "D",
              "legendFormat": "pending {{service_name}}"
            }
          ],
          "description": "HikariCP per service. Pending > 0 means requests are waiting for a connection: the pool (10 per pod) is the bottleneck."
        },
        {
          "id": 11,
          "title": "DB Query Time (avg)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(jdbc_query_milliseconds_sum{service_name=~\"$service\"}[5m])) by (service_name) / sum(rate(jdbc_query_milliseconds_count{service_name=~\"$service\"}[5m])) by (service_name)",
              "refId": "A",
              "legendFormat": "query (avg) {{service_name}}"
            },
            {
              "expr": "sum(rate(hikaricp_connections_acquire_milliseconds_sum{service_name=~\"$service\"}[5m])) by (service_name) / sum(rate(hikaricp_connections_acquire_milliseconds_count{service_name=~\"$service\"}[5m])) by (service_name)",
              "refId": "B",
              "legendFormat": "connection acquire (avg) {{service_name}}"
            }
          ],
          "description": "Per JDBC statement (datasource-micrometer), and the time a request waits to get a pool connection."
        },
        {
          "id": 12,
          "title": "CPU Throttling Ratio",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{container=~\"$service\"}[5m])) by (pod) / sum(rate(container_cpu_cfs_periods_total{container=~\"$service\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "Container Memory vs Limit",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container=~\"$service\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            },
            {
              "expr": "max(container_spec_memory_limit_bytes{container=~\"$service\"}) by (container)",
              "legendFormat": "limit {{container}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 14,
          "title": "Pod Health (restarts & readiness)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{container=~\"$service\"}[15m]))",
              "legendFormat": "restarts (15m)",
              "refId": "A"
            },
            {
              "expr": "sum(kube_pod_status_ready{condition=\"true\",namespace=\"default\",pod=~\"$service-.*\"})",
              "legendFormat": "ready pods",
              "refId": "B"
            }
          ]
        }
      ]
    }
  grpc-operations.json: |
    {
      "title": "gRPC Operations",
      "uid": "grpc-operations",
      "description": "Traffic and latency per gRPC service and method (e.g. message.v1.MessageService / GetMessage) - cardinality is bounded by the proto. grpc.health.v1 and reflection calls are excluded.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "query": "message-service",
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": "$__all"
              },
              {
                "selected": false,
                "text": "message-service",
                "value": "message-service"
              }
            ]
          },
          {
            "name": "rpc_service",
            "label": "gRPC service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(grpc_server_milliseconds_count{service_name=~\"$service\"}, rpc_service)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(grpc_server_milliseconds_count{service_name=~\"$service\"}, rpc_service)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "rpc_method",
            "label": "Method",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\"}, rpc_method)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\"}, rpc_method)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests/s",
          "description": "Total request rate for the selected services, methods and routes.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Write Share",
          "description": "Share of calls that are writes (Create*, Update*, Delete*).",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\",rpc_method=~\"(Create|Update|Delete).*\"}[5m])) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 Latency",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "p99 Latency",
