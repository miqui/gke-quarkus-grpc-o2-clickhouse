              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"$error_code\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Server Errors/s",
          "description": "INTERNAL_SERVER_ERROR (unhandled exceptions, gRPC INTERNAL) plus statuses the service never sends on purpose (UNKNOWN, UNAVAILABLE, DEADLINE_EXCEEDED, DATA_LOSS): bugs or dependency failures rather than bad requests. Should stay at 0.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.001
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"INTERNAL_SERVER_ERROR|UNKNOWN|INTERNAL|UNAVAILABLE|DEADLINE_EXCEEDED|DATA_LOSS\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Conflicts/s",
          "description": "CONFLICT: optimistic-lock version mismatches on UpdateMessage (ABORTED), duplicate author emails (ALREADY_EXISTS), and deleting an author who still has messages (FAILED_PRECONDITION). Expected under concurrent writes (see k6-transaction-isolation.js).",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=\"CONFLICT\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Errors by Code",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No errors",
              "custom": {
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"$error_code\"}[5m])) by (error_code)",
              "legendFormat": "{{error_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Error Ratio by Method",
          "description": "Only methods that have errored appear.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "noValue": "No errors"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"$error_code\"}[5m])) by (service_name, rpc_method) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_method=~\"$rpc_method\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Errors by Method and Code",
          "description": "Errors per RPC method and ErrorInfo reason.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No errors"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"$error_code\"}[5m])) by (service_name, rpc_method, error_code)",
              "legendFormat": "{{service_name}} / {{rpc_method}} / {{error_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Conflict Ratio by Method",
          "description": "Share of each method's calls that ended in CONFLICT.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "noValue": "No errors"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=\"CONFLICT\"}[5m])) by (service_name, rpc_method) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_method=~\"$rpc_method\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Client Input Errors (validation, oversized)",
          "description": "Calls rejected because of what the client sent: INVALID_ARGUMENT with field violations (BAD_USER_INPUT), and messages over the 16 KiB inbound limit (RESOURCE_EXHAUSTED, rejected by gRPC before the service runs).",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No errors"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"BAD_USER_INPUT|RESOURCE_EXHAUSTED\"}[5m])) by (service_name, error_code)",
              "legendFormat": "{{service_name}} / {{error_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "NOT_FOUND by Method",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No errors"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=\"NOT_FOUND\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Error Totals (current window)",
          "description": "Error counts per (service, method, code) over the selected time range.",
          "type": "table",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "errors",
                  "service_name": "service",
                  "rpc_method": "method",
                  "error_code": "code"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "errors",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "targets": [
            {
              "expr": "sum(increase(grpc_errors_total{service_name=~\"$service\",rpc_method=~\"$rpc_method\",error_code=~\"$error_code\"}[$__range])) by (service_name, rpc_method, error_code)",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
  trivy-security.json: |
    {
