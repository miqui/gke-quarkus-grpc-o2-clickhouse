          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "count(sum by (rpc_method) (rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) > 0) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Request Rate by Method",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) by (service_name, rpc_method)",
              "legendFormat": "{{service_name}} / {{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) by (service_name, rpc_service)",
              "refId": "A",
              "legendFormat": "{{service_name}} / {{rpc_service}}"
