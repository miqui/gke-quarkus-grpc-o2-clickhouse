          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Error Ratio",
          "description": "Non-OK calls / calls. Includes client-caused errors (NOT_FOUND, BAD_USER_INPUT, CONFLICT); see the gRPC Errors dashboard for the breakdown by code.",
          "type": "gauge",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(grpc_errors_total{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m])) or vector(0)) / sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Active Methods",
