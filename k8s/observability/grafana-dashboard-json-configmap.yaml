          ],
          "targets": [
            {
              "expr": "sum(rate(grpc_server_milliseconds_count{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[$__range])) by (service_name, rpc_method)",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(grpc_server_milliseconds_bucket{service_name=~\"$service\",rpc_service=~\"$rpc_service\",rpc_method=~\"$rpc_method\"}[$__range])) by (le, service_name, rpc_method))",
              "format": "table",
              "instant": true,
              "refId": "B"
