# Credentials for the observability namespace, built by External Secrets from GCP Secret Manager
# (seeded from 1Password by gke-secrets-seed.sh). Replaces the committed placeholder Secrets and
# the Argo CD ignoreDifferences workaround that kept Argo from overwriting the real values.
#
#   grafana-credentials                    Grafana admin (envFrom in grafana-deployment.yaml)
#   openobserve-root-credentials           OpenObserve root user (openobserve-values.yaml)
#   openobserve-remote-write-credentials   the same root user, as username/password files/env for
#                                          Prometheus remote_write and both OTel collectors
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: observability
  labels:
    app: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: grafana-admin-user
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: grafana-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root-credentials
  namespace: observability
  labels:
    app: openobserve
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openobserve-root-credentials
    creationPolicy: Owner
  data:
    - secretKey: ZO_ROOT_USER_EMAIL
      remoteRef:
        key: openobserve-root-email
    - secretKey: ZO_ROOT_USER_PASSWORD
      remoteRef:
        key: openobserve-root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-remote-write-credentials
  namespace: observability
  labels:
    app: prometheus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openobserve-remote-write-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: openobserve-root-email
    - secretKey: password
      remoteRef:
        key: openobserve-root-password
