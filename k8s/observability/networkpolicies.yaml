# Ingress NetworkPolicies for `observability` (enforced by GKE Dataplane V2). Default deny, then
# only the flows the metrics/logs/traces pipeline needs. Egress is left open: Prometheus scrapes
# every namespace plus the API server, and the collectors only talk to OpenObserve.
#
# Grafana, Prometheus and OpenObserve UIs are reached with `kubectl port-forward`
# (gke-port-forward.sh), which enters the pod's own network namespace and isn't subject to these
# rules. node-exporter runs hostNetwork, which NetworkPolicy doesn't apply to either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes: [Ingress]
  ingress:
    # OTLP from the message-service pods (metrics + traces).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: message-service
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    # Headlamp's Prometheus plugin queries through the API server's service proxy, which reaches
    # the pod via GKE's konnectivity agents in kube-system.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openobserve
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openobserve
  policyTypes: [Ingress]
  ingress:
    # Prometheus remote_write + self-monitoring scrape; OTLP traces and pod logs from the two
    # collectors.
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: otel-collector
        - podSelector:
            matchLabels:
              app: log-collector
      ports:
        - protocol: TCP
          port: 5080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
