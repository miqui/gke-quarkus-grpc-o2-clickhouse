# Read-only access to cluster-scoped resources for Headlamp's ServiceAccount. The built-in `view`
# ClusterRole (bound by the chart, see headlamp-values.yaml) only covers namespaced resources, so
# without this Headlamp's Nodes, Storage, CRD and cluster RBAC pages fail with "forbidden". `view`
# also doesn't aggregate Gateway API or GKE gateway policy CRDs, which Headlamp's Gateway pages list
# across all namespaces.
#
# get/list/watch only - still no Secrets (not listed here, and `view` excludes them), no exec, no
# writes. Deliberately not `cluster-admin`, which Kyverno's restrict-cluster-admin-bindings would
# also flag.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers, csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  # Gateway API (Headlamp's Gateway section; k8s/gateway.yaml) and GKE's gateway policy CRDs.
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - udproutes
      - referencegrants
      - backendtlspolicies
    verbs: [get, list, watch]
  - apiGroups: [networking.gke.io]
    resources: [healthcheckpolicies, gcpgatewaypolicies, gcpbackendpolicies]
    verbs: [get, list, watch]
  # CPU/memory figures on the node and pod pages (GKE ships metrics-server).
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
