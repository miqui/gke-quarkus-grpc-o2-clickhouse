# Nothing in the cluster needs to call Headlamp; the only way in is `kubectl port-forward`, which
# NetworkPolicy doesn't apply to. Deny all other ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes: [Ingress]
