# postgres-credentials, built by External Secrets from GCP Secret Manager (seeded from 1Password
# by gke-secrets-seed.sh). Read by the message-service and postgres-exporter containers and, via
# the PostgresInstance's passwordSecretRef, by Crossplane - which sets the Cloud SQL user's
# password from it - so the app and the database can't drift apart.
#
# The user name isn't a secret, so it's templated in here rather than stored; it must match
# spec.userName in postgres.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  labels:
    app: message-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      data:
        DB_USER: message_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-app-password
