# Every container (init containers included) needs CPU/memory requests and limits.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require resource requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?requests.?cpu.hasValue() && c.?resources.?requests.?memory.hasValue())
      message: "Containers must set CPU and memory requests."
    - expression: >-
        variables.containers.all(c,
          c.?resources.?limits.?cpu.hasValue() && c.?resources.?limits.?memory.hasValue())
      message: "Containers must set CPU and memory limits."
