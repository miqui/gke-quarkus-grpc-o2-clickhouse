# Audit-only on purpose. k8s/kustomization.yaml ships `newTag: latest` as the fallback, and Argo
# CD Image Updater only swaps in a timestamped tag *after* the first sync - so denying :latest
# would block the very first rollout. Audit still surfaces it in PolicyReports (and in CI, where
# it is reported as a warning). Once the first sync no longer depends on :latest this can move
# to the enforce set.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest (or missing) image tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  # Audit-only, so it must never block: see the note in overlays/audit-other.
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["default", "observability", "headlamp"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    # Pinned = digest, or a tag on the last path segment that isn't `latest`.
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@') ||
          (c.image.split('/')[c.image.split('/').size() - 1].contains(':') &&
           !c.image.endsWith(':latest')))
      message: "Images must be pinned to a tag other than :latest (or a digest)."
