# GCP Secret Manager as the source for every ExternalSecret in the cluster. No `auth` block: the
# ESO controller authenticates as its own Kubernetes ServiceAccount, which Workload Identity maps
# to the external-secrets GSA (see gke-deploy.sh / k8s/external-secrets/values.yaml). That GSA
# can read only the secrets gke-secrets-seed.sh created, and only namespaces listed under
# `conditions` may reference this store at all.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: k8s-dev-412419
  conditions:
    - namespaces:
        - default
        - observability
        - clickhouse
